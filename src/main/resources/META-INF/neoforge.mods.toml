modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

#issueTrackerURL="https://github.com/caftan12679/Music-Looper/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="hemjj, 蓝色大肥鱼"
description='''
让原版音乐连续循环播放，并把 config/musiclooper/music 里的第三方音乐加入随机播放列表。
当第三方音乐数量达到设定门槛时，可以在配置里完全禁用原版音乐。
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
