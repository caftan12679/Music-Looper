modLoader="javafml"
loaderVersion="[47,)"
license="GPL-3.0"
issueTrackerURL="https://github.com/caftan12679/Music-Looper/issues"

# 纯客户端模组：专用服务器上会被跳过，也不会因为服务端没装而红叉
clientSideOnly=true

[[mods]]
modId="musiclooper"
version="1.1.0"
displayName="Music Looper"
authors="hemjj,蓝色大肥鱼"
description='''
让原版音乐连续循环播放，并把 config/musiclooper/music 里的第三方音乐加入随机播放列表。
当第三方音乐数量达到设定门槛时，可以在配置里完全禁用原版音乐。
'''

[[dependencies.musiclooper]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.musiclooper]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
